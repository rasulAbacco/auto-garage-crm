<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- maximum-scale=1 stops iOS zooming in when an input is tapped (that zoom made the app look wider on iPhone) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" content="#001F3F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Primary Title (Kept Same As Requested) -->
  <title>The Motor Desk</title>

  <!-- SEO Meta Description -->
  <meta name="description"
    content="The Motor Desk is an AI-powered car dealership CRM software that helps used car dealers manage inventory, leads, sales, and customer communication efficiently." />

  <!-- SEO Keywords -->
  <meta name="keywords"
    content="The Motor Desk, car dealership CRM, used car dealer software, automotive CRM platform, dealership management system, auto dealer software" />

  <!-- Author -->
  <meta name="author" content="The Motor Desk" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://themotordesk.com/" />

  <!-- Open Graph (Facebook, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="The Motor Desk - AI Car Dealership CRM Software" />
  <meta property="og:description"
    content="AI-powered CRM platform for car dealerships. Manage inventory, leads, and sales with The Motor Desk." />
  <meta property="og:url" content="https://themotordesk.com/" />
  <meta property="og:image" content="https://themotordesk.com/Logos/logo3.png" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Motor Desk - Car Dealership CRM" />
  <meta name="twitter:description" content="Automotive dealership management software built for used car dealers." />
  <meta name="twitter:image" content="https://themotordesk.com/Logos/logo3.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/Logos/logo3.png" />
  <link rel="apple-touch-icon" href="/Logos/logo3.png" />

  <!-- Structured Data (Very Important for Brand Recognition) -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "The Motor Desk",
        "url": "https://themotordesk.com/",
        "logo": "https://themotordesk.com/Logos/logo3.png",
        "description": "AI-powered car dealership CRM software for managing inventory, leads, and sales.",
        "sameAs": [
          "https://play.google.com/store/apps/details?id=YOUR_APP_ID"
        ]
      }
    </script>

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="bg-gray-50">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
